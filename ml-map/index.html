<style>
/* Layout: one full-screen knowledge map (3D or 2D). Ranking panel left, chosen topic's card right,
   legend bottom-left, navigation bottom-right. Text labels live in an HTML layer above the canvas. */
:root{
  --ground:#EDF0F4; --paper:#F6F7F9; --panel:#FFFFFF; --ink:#131C26; --muted:#586574; --rule:#D3D9E0; --dim:#DDE2E8; --edge:#AEB8C3;
  /* six subjects: validated to stay apart for colour-blind viewers (all pairs) */
  --L:#1b45cd; --C:#009fb7; --P:#d52004; --S:#b88512; --O:#a91185; --M:#a763f8;
  /* progress: one green, stepped from pale (read) to full (video exists); "not yet" is neutral */
  --taught:#0c7a4d; --read:#58b08c; --ahead:#BCC3CC;
  --display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#080C11; --paper:#0D1218; --panel:#151D27; --ink:#E8EEF4; --muted:#8E9BA9; --rule:#263240; --dim:#1E2731; --edge:#3B4856;
  --L:#1e5fdd; --C:#17a0b7; --P:#bb3205; --S:#ae8d36; --O:#ef4894; --M:#ab69fd;
  --taught:#62e3ad; --read:#23815f; --ahead:#3A4552; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#080C11; --paper:#0D1218; --panel:#151D27; --ink:#E8EEF4; --muted:#8E9BA9; --rule:#263240; --dim:#1E2731; --edge:#3B4856;
  --L:#1e5fdd; --C:#17a0b7; --P:#bb3205; --S:#ae8d36; --O:#ef4894; --M:#ab69fd;
  --taught:#62e3ad; --read:#23815f; --ahead:#3A4552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(16px,1.7vw,20px);margin:0;letter-spacing:-.01em;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel)}
.seg .k{font-size:11.5px;color:var(--muted);padding:0 3px 0 10px;align-self:center}
.btn{font:inherit;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--L);outline-offset:1px}
input[type=search]{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:99px;padding:4px 12px;width:150px;max-width:100%}
.stage{position:relative;flex:1;min-height:440px;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--paper)}
#graph{position:absolute;inset:0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels span{position:absolute;left:0;top:0;transform-origin:0 0;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;color:var(--ink);opacity:0;transition:opacity .18s;will-change:transform;
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 4px var(--paper),0 0 6px var(--paper)}
#labels span.big{font-weight:700}
#labels span.reg{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#ring{position:absolute;left:0;top:0;border-radius:50%;border:2.5px solid var(--ink);pointer-events:none;box-shadow:0 0 0 2px var(--paper)}
#ring::after{content:"";position:absolute;inset:-2.5px;border-radius:50%;border:2px solid var(--ink);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion: reduce){#ring::after{animation:none;opacity:0}#labels span{transition:none}}
.float-tooltip-kap{background:var(--panel)!important;color:var(--ink)!important;border:1px solid var(--rule);border-radius:8px!important;padding:5px 9px!important;font:500 12.5px/1.4 var(--body)!important;box-shadow:0 6px 18px rgba(5,10,15,.25);max-width:280px}
.float-tooltip-kap small{display:block;color:var(--muted);font-size:11.5px}
.legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:2px 4px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);padding:4px 6px;border-radius:10px;max-width:calc(100% - 20px)}
.legend button,.legend span.it{font:inherit;color:inherit;background:none;border:0;border-radius:99px;padding:1px 7px;white-space:nowrap}
.legend button{cursor:pointer}
.legend button:hover{background:var(--ground);color:var(--ink)}
.legend b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.nav{position:absolute;right:10px;bottom:8px;display:grid;justify-items:end;gap:4px}
.nav .row{display:flex;gap:4px;align-items:center}
.btn.sq{width:28px;padding:4px 0;text-align:center}
.hint{font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);padding:2px 8px;border-radius:8px;text-align:right}
.panel{position:absolute;top:10px;max-height:calc(100% - 66px);background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  box-shadow:0 10px 30px rgba(5,10,15,.16);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.panel .scroll{overflow-y:auto;min-height:0;display:grid;gap:9px;align-content:start;padding-right:2px}
#rank{left:10px;width:324px}
#card{right:10px;width:340px}
.panel h2{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.25;margin:0;text-wrap:balance;padding-right:18px}
.lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.src{font-size:12.5px;color:var(--muted)}
.gate{display:flex;align-items:baseline;gap:8px}
.gate b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.gate span{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;border-left:3px solid var(--ink);padding:2px 0 2px 9px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills button{font:inherit;font-size:12px;background:var(--ground);border:1px solid var(--rule);border-radius:99px;padding:2px 8px;cursor:pointer;color:var(--ink);text-align:left}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rlist button{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center;font:inherit;font-size:12.5px;line-height:1.35;background:none;border:0;border-radius:8px;padding:4px 6px;cursor:pointer;color:var(--ink);text-align:left}
.rlist button:hover,.rlist button.cur{background:var(--ground)}
.rlist .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.rlist .bar{height:4px;border-radius:2px;margin-top:3px}
.path{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px;max-height:210px;overflow-y:auto}
.path button{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px;font:inherit;font-size:12.5px;background:none;border:0;border-radius:6px;padding:2px 4px;cursor:pointer;color:var(--ink);text-align:left}
.path button:hover{background:var(--ground)}
.path .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.mk{font-weight:700}.mk.taught{color:var(--taught)}.mk.read{color:var(--read)}.mk.ahead{color:var(--muted)}
details summary{cursor:pointer;font-size:12.5px;font-weight:600}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.vids a{display:block;color:var(--ink);text-decoration:none;font-size:12.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--rule)}
.vids a:hover{border-color:var(--ink)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--rule);background:var(--ground);color:var(--muted);border-radius:99px;padding:3px 4px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#tour{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:99px;
  padding:4px 5px 4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(5,10,15,.16);max-width:calc(100% - 20px);white-space:nowrap}
#tour .n{color:var(--muted);font-variant-numeric:tabular-nums}
#tour .tt{overflow:hidden;text-overflow:ellipsis}
.go{justify-self:start}
.intro{font-size:12.5px;color:var(--muted);margin:0}
.intro b{color:var(--ink);font-weight:600}
.stg{border-top:1px solid var(--rule)}
.stg:first-child{border-top:0}
.stg>summary{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:8px;list-style:none;font-size:13px;position:sticky;top:0;z-index:1;background:var(--panel)}
.stg>summary::-webkit-details-marker{display:none}
.stg>summary:hover{background:var(--ground)}
.stg>summary::after{content:"▸";color:var(--muted);font-size:11px;width:10px}
.stg[open]>summary::after{content:"▾"}
.stg .no{width:22px;height:22px;border-radius:50%;border:2px solid;font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.stg .nm{flex:1;min-width:0;line-height:1.3}
.stg .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.stg .ct{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.stg .rlist{padding:0 0 6px 2px}
.rlist .m{font-size:11px;width:14px;text-align:center}
.mats{display:flex;flex-wrap:wrap;gap:4px 12px}
.vids+details{margin-top:-4px}
#labels i.pl{position:absolute;left:0;top:0;display:none;will-change:transform}
#labels i.pl svg{display:block;width:100%;height:100%}
.vdot{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:-2px}
.vdot svg{width:8px;height:8px}
.vids a.vrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:4px;line-height:1.35}
.vids a.vrow.cur{border-color:var(--ink);background:var(--ground)}
.vrow .th{position:relative;width:92px;height:52px;border-radius:5px;overflow:hidden;background:#10161d;display:grid;place-items:center}
.vrow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vrow .th svg{position:relative;width:22px;height:22px;padding:5px;border-radius:50%;background:rgba(0,0,0,.55)}
.vrow.plain .th{width:24px;height:24px;border-radius:50%;background:var(--muted)}
.vrow.plain .th svg{background:none;padding:0;width:11px;height:11px}
#player{position:relative;height:0;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#card.playing{width:min(470px,calc(100% - 20px))}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px}
#dn[aria-pressed="true"]{background:var(--taught);border-color:var(--taught);color:var(--panel)}
.lnk{font:inherit;font-size:12px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;justify-self:start}
.lnk:hover{color:var(--ink)}
.per{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted);margin-top:-4px}
.per b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pills button.ok::before,.path button.ok span:last-child::before{content:"✓ ";color:var(--taught);font-weight:700}
.rlist .n.ok{color:var(--taught);font-weight:700}
.rlist small{display:block;color:var(--muted);font-size:11.5px}
.lab{display:flex;gap:8px}
.lab .pg{margin-left:auto;margin-right:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.prog{height:4px;border-radius:2px;background:var(--ground);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--taught);border-radius:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.chk input{margin:0;accent-color:var(--ink)}
.stg .ct{text-align:right;line-height:1.3}
.stg .ct small{display:block}
.stg .lnk{margin:0 0 4px 34px}
@media (max-width:1340px){.sub{display:none}}
/* the linear list: the same order as the roadmap, as one long page over the map */
#list{position:absolute;inset:0;z-index:5;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.lw{position:relative;max-width:840px;margin:0 auto;padding:18px 16px 60px 120px}
.arcs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.arcs .bus{fill:none;stroke-width:1.4;opacity:.62}
.arcs .tip{stroke:none;opacity:.62}
.arcs.has .bus,.arcs.has .tip{opacity:.13}
.arcs .hl{fill:none;stroke-width:3;opacity:1;stroke-linejoin:round}
.arcs .tip.hl{stroke:none;opacity:1}
.ll .mp{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.ll .mp:hover{color:var(--ink);border-color:var(--ink)}
.ll .mp svg{width:16px;height:16px}
@media (max-width:760px){.lw{padding-left:58px;padding-right:12px}}
.lw>h2{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.lw>.intro{font-size:15px;max-width:62ch;margin-bottom:10px}
.lw>.prog{margin:4px 0 6px;height:6px;border-radius:3px}
.lw .pgt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ls{margin-top:22px}
.ls h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:18px;line-height:1.3;position:sticky;top:0;z-index:2;background:var(--paper);padding:8px 0 6px;border-bottom:1px solid var(--rule)}
.ls h3 small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.ls h3 .no{width:28px;height:28px;border-radius:50%;border:2.5px solid;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.ll{list-style:none;margin:0;padding:0}
.ll>li{display:grid;grid-template-columns:28px minmax(0,1fr) 30px;gap:10px;padding:10px 0;border-bottom:1px solid var(--dim)}
.ll>li.on{background:color-mix(in srgb,var(--ground) 70%,transparent);box-shadow:-8px 0 0 color-mix(in srgb,var(--ground) 70%,transparent),8px 0 0 color-mix(in srgb,var(--ground) 70%,transparent)}
.ll>li.pre .ck{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.ll>li.nxt .ck{background:var(--sel);border-color:var(--sel);color:#fff}
.ll>li.on .ck{box-shadow:0 0 0 3px var(--sel)}
.rel{display:grid;gap:6px;margin-top:8px;font-size:13.5px}
.rel .pills button{font-size:13px;padding:3px 10px}
.rel .lab{font-size:11px}
.ll .ck{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);background:var(--panel);color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.ll .ck:hover{border-color:var(--ink);color:var(--ink)}
.ll li.ok .ck{background:var(--taught);border-color:var(--taught);color:var(--panel);font-size:14px}
.ll .tt{font:inherit;font-size:16.5px;font-weight:600;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;line-height:1.35}
.ll .tt:hover{text-decoration:underline;text-underline-offset:3px}
.ll li.ok .tt{color:var(--muted)}
.ll .sm{font-size:13.5px;color:var(--muted);margin-top:1px}
.ll .sm a{color:var(--read);font-weight:600;text-decoration:none}
.ll .sm a:hover{text-decoration:underline}
.lv{list-style:none;margin:5px 0 0;padding:0;display:grid;gap:3px}
.lv a{display:inline-flex;gap:6px;align-items:baseline;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.lv a:hover{text-decoration:underline;text-underline-offset:2px}
.lv .vdot{flex:none;background:var(--taught);vertical-align:0}
.listing #sM,.listing #sL,.listing #sC,.listing #rankBtn{display:none}
.mob,.bkpill,.btn .ic{display:none}
#opts{position:fixed;inset:0;z-index:50;background:rgba(5,10,15,.35);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel);border-radius:18px 18px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(5,10,15,.2);max-height:80%;overflow-y:auto}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:15px}
.shh .x{position:static}
.orow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--rule)}
.orow>.olab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.orow .seg{display:flex;width:100%}
.orow .seg button{flex:1;font-size:14px;padding:8px 6px}
.orow .seg .k{display:none}
.orow .btn{font-size:14px;padding:8px 14px;justify-self:start}
@media (max-width:760px){
  .sub,.hint,.spacer,.seg .k{display:none}
  .mob{display:inline-grid;place-items:center}
  .btn.sq.mob{width:34px;height:32px}
  .mob svg{width:17px;height:17px}
  #optBtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  header{flex-wrap:nowrap}
  header>#sV{flex:1;min-width:0}
  header>#sV button{flex:1;font-size:13.5px;padding:6px 4px}
  header>#q{display:none}
  header.srch{flex-wrap:wrap}
  header.srch>#q{display:block;order:9;flex:1 1 100%;font-size:16px;padding:7px 12px}
  #toolSeg,#zIn,#zOut{display:none!important}
  .legend{flex-wrap:nowrap;overflow-x:auto;right:10px;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .bkpill{display:block;position:absolute;left:8px;top:8px;z-index:3;font:inherit;font-size:13px;font-weight:600;background:var(--ink);color:var(--panel);border:0;border-radius:99px;padding:5px 12px}
  .listing .bkpill{display:none}
  .nav .btn{width:36px;height:34px;padding:0;display:grid;place-items:center}

function setHash(h) { try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) {} }
function showList(on) {
  $('list').hidden = !on; document.body.classList.toggle('listing', on);
  if (on) { drawList(); select(null); $('rank').hidden = true; }
  else if (innerWidth > 760) $('rank').hidden = false;
  try { G && (on ? G.pauseAnimation() : G.resumeAnimation()); } catch (e) {}
  setHash((SIMPLE ? '#rut-gon' : '') + (on ? (SIMPLE ? '-' : '#') + 'danh-sach' : ''));
  $('vF').classList.toggle('on', !on && !SIMPLE); $('vS').classList.toggle('on', !on && SIMPLE); $('vL').classList.toggle('on', on);
}
function goVersion(simple) {
  if (simple === SIMPLE) return showList(false);
  location.hash = simple ? 'rut-gon' : ''; location.reload();
}
$('vF').onclick = () => goVersion(false);
$('vS').onclick = () => goVersion(true);
$('vL').onclick = () => showList($('list').hidden);

function drawLegend() {
  const it = (bg, text, c) => `<span class="it"><span class="dot" style="background:${bg}"></span>${text} <b>${c}</b></span>`, nL = N.filter(canLearn).length;
  $('legend').innerHTML = (colorBy === 'domain'
    ? Object.entries(DOM).map(([k, v]) => `<button data-d="${k}" title="Bay tới ${v}: ${domStat[k].n} chủ đề"><span class="dot" style="background:var(--${k})"></span>${v} <b>${domStat[k].n}</b></button>`).join('')
    : colorBy === 'status' ? Object.entries(ST).map(([k, v]) => it(`var(--${k})`, v, counts[k])).join('')
    : it('var(--L)', 'Màu đậm: đã hiểu', done.size) + it('color-mix(in srgb,var(--L) 55%,var(--paper))', 'Màu nhạt: học được ngay', nL) + it('var(--ahead)', 'Xám: chưa tới', N.length - done.size - nL))
    + `<span class="it"><span class="vdot">${PLAY}</span>có video <b>${withVid}</b></span>`;
  $('legend').querySelectorAll('button').forEach(b => b.onclick = () => focusDomain(b.dataset.d));
}
const CB = { cD: 'domain', cS: 'status', cM: 'progress' };
function setColor(c) { colorBy = c; Object.entries(CB).forEach(([b, k]) => $(b).classList.toggle('on', k === c)); drawLegend(); refresh(); }
Object.entries(CB).forEach(([b, k]) => $(b).onclick = () => setColor(k));
setColor(colorBy);

// ---- controls
const seg = (a, b, on) => { $(a).classList.toggle('on', on); $(b).classList.toggle('on', !on); };
$('m3').onclick = () => { if (mode === '3d') return; mode = '3d'; seg('m3', 'm2', true); build(); };
$('m2').onclick = () => { if (mode === '2d') return; mode = '2d'; seg('m3', 'm2', false); build(); };
$('lC').onclick = () => { if (layout === 'cum') return; layout = 'cum'; seg('lC', 'lT', true); relayout(); };
$('lT').onclick = () => { if (layout === 'tang') return; layout = 'tang'; seg('lC', 'lT', false); relayout(); };
$('tR').onclick = () => { tool = 'rotate'; applyTool(); };
$('tP').onclick = () => { tool = 'pan'; stopSpin(); applyTool(); };
$('spinBtn').onclick = () => { spin = !spin; applySpin(); };
$('zIn').onclick = () => { stopSpin(); zoomBy(1.5); };
$('zOut').onclick = () => { stopSpin(); zoomBy(1 / 1.5); };
$('rankBtn').onclick = () => { $('rank').hidden = !$('rank').hidden; if (!$('rank').hidden && innerWidth <= 760) { $('card').hidden = true; if ($('player')) { $('player').innerHTML = ''; $('player').hidden = true; $('card').classList.remove('playing'); } } };
$('fitBtn').onclick = () => { select(null); fit(); };
['pointerdown', 'wheel', 'touchstart'].forEach(ev => $('graph').addEventListener(ev, () => { stopSpin(); endTour(); }, { passive: true }));
$('q').addEventListener('change', e => { const v = e.target.value.trim().toLowerCase(); if (!v) return; const n = N.find(x => x.t.toLowerCase() === v) || N.find(x => x.t.toLowerCase().includes(v)); if (n && !$('list').hidden) showList(false); if (n && n.id !== sel) select(n.id); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return select(null);
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const step = { ArrowLeft: [-70, 0], ArrowRight: [70, 0], ArrowUp: [0, -70], ArrowDown: [0, 70] }[e.key];
  if (step) { e.preventDefault(); stopSpin(); panBy(step[0], step[1]); }
  else if (e.key === '+' || e.key === '=') zoomBy(1.4);
  else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.4);
});
const isDark = () => (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paint() { $('themeBtn').textContent = isDark() ? '☀' : '☾'; $('themeBtn').setAttribute('aria-label', isDark() ? 'Chuyển sang nền sáng' : 'Chuyển sang nền tối'); $('themeBtn').title = isDark() ? 'Nền sáng' : 'Nền tối'; if (G) { readColors(); G.backgroundColor(K.paper); if (mode === '3d') setFog(); refresh(); } }
const saved = store.get('nm-theme', ''); if (saved) document.documentElement.setAttribute('data-theme', saved);
$('themeBtn').onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store.set('nm-theme', t); paint(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (G) { G.width($('graph').clientWidth).height($('graph').clientHeight); dirty = true; } }, 150); });
build(); paint(); frame();
showList(/danh-sach/.test(location.hash));
</script>
</body>
</html>
